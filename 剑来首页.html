          <li><input type="radio" name="g6" id="g6d" class="jl-radio"><label for="g6d"><span class="jl-ck">D</span> 凡铁（无特殊之物，白手起家）</label></li>
          <li><input type="radio" name="g6" id="g6e" class="jl-radio"><label for="g6e"><span class="jl-ck">E</span> 远古神物（神道碎片/至高遗物）</label></li>
        </ul>
      </div>
    </div>

    <div class="jl-cfg-panel" style="margin-top:10px;">
      <div class="jl-cfg-phead">柒 · 阵营归属</div>
      <div class="jl-cfg-faction">
        <div><input type="radio" name="g7" id="g7a" class="jl-radio"><label for="g7a"><span class="jl-ck">A</span> 落魄山</label></div>
        <div><input type="radio" name="g7" id="g7b" class="jl-radio"><label for="g7b"><span class="jl-ck">B</span> 文圣一脉</label></div>
        <div><input type="radio" name="g7" id="g7c" class="jl-radio"><label for="g7c"><span class="jl-ck">C</span> 剑气长城/隐官</label></div>
        <div><input type="radio" name="g7" id="g7d" class="jl-radio"><label for="g7d"><span class="jl-ck">D</span> 大骊王朝/山下</label></div>
        <div><input type="radio" name="g7" id="g7e" class="jl-radio"><label for="g7e"><span class="jl-ck">E</span> 蛮荒王座</label></div>
        <div><input type="radio" name="g7" id="g7f" class="jl-radio"><label for="g7f"><span class="jl-ck">F</span> 孤魂野鬼（无阵营）</label></div>
      </div>
    </div>

    <!-- 进度指示 -->
    <div class="jl-cfg-progress">
      <div class="jl-cfg-dot" id="jd1"></div><div class="jl-cfg-dot" id="jd2"></div>
      <div class="jl-cfg-dot" id="jd3"></div><div class="jl-cfg-dot" id="jd4"></div>
      <div class="jl-cfg-dot" id="jd5"></div><div class="jl-cfg-dot" id="jd6"></div>
      <div class="jl-cfg-dot" id="jd7"></div>
    </div>

    <!-- 输出区 -->
    <div class="jl-cfg-output">
      <div class="jl-cfg-out-label">&#9670; 生成的角色背景提示 &#9670;</div>
      <div id="jlOutText">
        <span id="jlOutEmpty">点击上方各维度选项，此处自动生成完整背景描述...</span>
      </div>
    </div>

    <div class="jl-cfg-copy-hint">
      &#9650; 选中上方文本 &rarr; Ctrl+C 复制 &rarr; 粘贴到输入框，可追加自由描述后发送
    </div>
  </div>

</div>

<script>
(function(){
  // === 页面切换事件 ===
  var startBtn = document.getElementById('jlStartBtn');
  if(startBtn){ startBtn.addEventListener('click',function(){
    var p1=document.getElementById('jlPage1'); if(p1)p1.style.display='none';
    var p2=document.getElementById('jlPage2'); if(p2)p2.style.display='block';
  });}
  var backBtn = document.getElementById('jlBackBtn');
  if(backBtn){ backBtn.addEventListener('click',function(){
    var p2=document.getElementById('jlPage2'); if(p2)p2.style.display='none';
    var p1=document.getElementById('jlPage1'); if(p1)p1.style.display='flex';
  });}
  // === radio 事件绑定 ===
  var allRadios = document.querySelectorAll('.jl-radio');
  for(var ri=0; ri<allRadios.length; ri++){
    allRadios[ri].addEventListener('change', function(){ window.jlUpdate && window.jlUpdate(); });
  }

  var texts = {
    g1a:"你出身泥瓶巷，是骊珠洞天底层孤儿，自幼孤苦伶仃，在泥瓶巷的陋巷中摸爬滚打长大。",
    g1b:"你出身宗门嫡传，自幼在仙家正统中修炼成长，根骨天赋皆为上佳，被宗门寄予厚望。",
    g1c:"你出身王朝贵胄，是大骊/宝瓶洲权贵之后，自幼锦衣玉食，却也深谙朝堂与山上的权力博弈。",
    g1d:"你出身蛮荒妖裔，血脉源自托月山，体内流淌着远古大妖的传承，在弱肉强食的法则中生存至今。",
    g1e:"你出身远古遗族，是神道余烬或十豪之后，血脉中沉睡着早已被遗忘的上古力量，却也因此背负着沉重的宿命。",
    g1f:"你出身山野散人，无根无系的自由身，没有宗门庇护，没有家族依靠，一个人在这座天下闯荡至今。",
    g2a:"你的修行道统为剑修——在窍穴中温养本命飞剑，杀力天下第一，同境无敌，可越境杀敌。",
    g2b:"你的修行道统为纯粹武夫——不借灵气，纯修气血筋骨，以肉身成圣，近战之中克制一切练气士。",
    g2c:"你的修行道统为练气士——走正统十五境大道，炼气化神，步步登天，是天下修士中最为正统的一脉。",
    g2d:"你的修行道统为兵家修士——擅长战场杀伐与军阵之法，在千军万马中取敌将首级如探囊取物。",
    g2e:"你的修行道统为山泽野修——不择手段，野路子出身，没有师承没有门派，一切靠自己争、自己抢。",
    g2f:"你的修行道统为三教门生——儒/道/释正统传承，有完整的师门体系和深厚的底蕴支撑。",
    g3a:"你当前的境界尚属蝼蚁——下五境/炼体三境，在这座天下勉强自保，但未来可期，根基未定。",
    g3b:"你当前的境界已初窥门径——中五境/炼气三境，已能御风而行、施展术法，在世俗中已算得上高手。",
    g3c:"你当前的境界已达小宗师——金丹/元婴/武胆，已是一方势力中不可忽视的存在，行走天下无人敢小觑。",
    g3d:"你当前的境界已是一方豪强——玉璞/仙人/止境，在山上山下皆有名号，寻常修士见你需低头行礼。",
    g3e:"你当前的境界已是山巅大能——飞升/武神之下，放眼整座天下，能与你匹敌者不过寥寥数人。",
    g3f:"你当前是凡人之躯——无修为，故事才刚刚开始，但正是这样的起点，才蕴藏着无限的可能。",
    g4a:"你身处浩然天下——人族腹地，儒家治世，九洲各有圣人镇守，礼乐秩序之下暗流涌动。",
    g4b:"你身处剑气长城——浩然与蛮荒的边界，万年来人族与妖族在此对峙，城墙上的每一块砖都浸透了剑修的血。",
    g4c:"你身处蛮荒天下——妖族领地，弱肉强食是唯一的法则，托月山与英灵殿的阴影笼罩着这片大地。",
    g4d:"你身处青冥天下——道门圣地，白玉京五城十二楼统辖三十六洞天七十二福地，以抵御化外天魔为责。",
    g4e:"你身处五彩天下——剑气长城半截飞升后形成的新天下，剑修绝对主导，飞升城为核心，宁姚为当世第一人。",
    g5a:"此时是剑来14年——骊珠洞天坠落前夕，三教棋局尚未揭晓，陈平安仍在泥瓶巷中。",
    g5b:"此时是剑来21年——陈平安已镇守剑气长城，人族与妖族的对峙进入最紧张的阶段，大战一触即发。",
    g5c:"此时是剑来27年——妖族全面入侵，天下烽烟四起，生灵涂炭，每一个人都被卷入了这场浩劫。",
    g5d:"此时是剑来39年——浩然天下开始反攻，人族在各条战线上收复失地，胜利的曙光已现但代价惨重。",
    g5e:"此时是终局——登天之战已至，世间秩序即将重构，旧神与新圣的博弈将决定这方天地的最终命运。",
    g5f:"此时是远古——神道尚存，破天之前，至高神与十豪并立的时代，天地规则尚未完全固化，一切皆有可能。",
    g6a:"你的本命之物为自炼飞剑——在窍穴中温养多年，剑名与神通皆由你自定，寄托着你的大道与性命。",
    g6b:"你的本命之物为仙兵遗宝——或许是四大仙剑之一，或许是失传已久的古宝，威力巨大但因果牵连甚广。",
    g6c:"你的本命之物为本命瓷——绑定气运与寿元，是你的护身符，也是你的枷锁，一旦被他人掌控，生死便不由己。",
    g6d:"你的本命之物为凡铁——无特殊之物，白手起家，没有捷径可走，但正因如此，每一步都走得踏实。",
    g6e:"你的本命之物为远古神物——神道碎片或至高遗物，蕴含着远超这个时代的威能，但也引来了无数觊觎的目光。",
    g7a:"你的阵营归属为落魄山——陈平安创立的势力，虽非最强，但人情味最浓，这里有一群愿意为彼此赴死的同伴。",
    g7b:"你的阵营归属为文圣一脉——荀渊门下，左右、崔瀺、齐静春皆为你的师兄，传承着「事功」学说与读书人的脊梁。",
    g7c:"你的阵营归属为剑气长城/隐官——站在人族与妖族的最前线，剑修在此淬炼杀力，用剑说话，用命守城。",
    g7d:"你的阵营归属为大骊王朝/山下——在世俗王朝的权力场中行走，庙堂之高与江湖之远，你皆有所涉。",
    g7e:"你的阵营归属为蛮荒王座——站在妖族一方，与人族为敌，你的立场决定了你的敌人和你的盟友。",
    g7f:"你的阵营归属为孤魂野鬼——无阵营，不站队，一个人在这座天下独自前行，是敌是友全凭本心。"
  };

  var groups = ['g1','g2','g3','g4','g5','g6','g7'];
  var colors = ['#d4a854','#c9a040','#e0c060','#b89030','#d4a854','#c49a3a','#d4a854'];

  window.jlUpdate = function(){
    var out = document.getElementById('jlOutText');
    var empty = document.getElementById('jlOutEmpty');
    var parts = [];
    var anyChecked = false;
    for(var i=0; i<groups.length; i++){
      var radios = document.getElementsByName(groups[i]);
      for(var j=0; j<radios.length; j++){
        if(radios[j].checked){
          anyChecked = true;
          var key = radios[j].id;
          if(texts[key]) parts.push(texts[key]);
          var dot = document.getElementById('jd'+(i+1));
          if(dot){ dot.style.background = colors[i]; dot.style.boxShadow = '0 0 8px '+colors[i]; dot.style.borderColor = colors[i]; }
          break;
        }
      }
    }
    if(anyChecked && empty){ empty.style.display = 'none'; }
    else if(empty){ empty.style.display = 'block'; }
    if(parts.length > 0){
      out.innerHTML = (empty && empty.style.display==='none' ? '' : '') + parts.join('');
    }
  };
})();
</script>
