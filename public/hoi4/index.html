<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>钢铁雄心4 · 移动版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a1520;color:#d8e0e8;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
/* 顶部HUD */
#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#101f30;border-bottom:1px solid #234;font-size:13px;flex-wrap:wrap}
#hud .stat{background:#1a2f45;padding:3px 8px;border-radius:4px}
#speedBtn{background:#2a4a6a;border:none;color:#fff;padding:5px 12px;border-radius:4px;font-size:14px;margin-left:auto}
/* 地图 */
#mapWrap{flex:1;position:relative;min-height:0}
#map{width:100%;height:100%;display:block;touch-action:none}
#tileInfo{position:absolute;left:8px;bottom:8px;background:rgba(10,25,40,.9);padding:6px 10px;border-radius:6px;font-size:12px;max-width:70%;pointer-events:none;border:1px solid #345}
/* 底部标签页 */
#tabs{display:flex;background:#101f30;border-top:1px solid #234}
.tabBtn{flex:1;padding:10px 0;text-align:center;background:none;border:none;color:#8aa;font-size:14px}
.tabBtn.active{color:#ffd700;border-top:2px solid #ffd700}
.panel{display:none;height:32vh;overflow-y:auto;padding:10px;background:#0d1a28}
.panel.active{display:block}
/* 面板条目 */
.tech,.prodItem,.diploRow{padding:9px 10px;margin-bottom:6px;background:#16283a;border-radius:6px;font-size:13px}
.tech.cur{border-left:3px solid #ffd700}
.tech.done{opacity:.55}
.tech.locked{opacity:.4}
.prodItem.locked{opacity:.4}
.diploRow{display:flex;justify-content:space-between;align-items:center}
.diploRow.dead{opacity:.4}
.warBtn{background:#8a2a2a;border:none;color:#fff;padding:5px 14px;border-radius:4px;font-size:12px}
.warTag{color:#ff6b6b;font-size:12px}
small{color:#7a9;display:block;font-size:11px}
/* 日志 */
#logPanel{height:12vh;overflow-y:auto;background:#0a141f;padding:6px 10px;font-size:11px;color:#9ab;border-top:1px solid #234}
/* 选国界面 */
#startScreen{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a2f45 0%,#0a1520 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;padding:20px}
#startScreen h1{font-size:26px;color:#ffd700;margin-bottom:6px;letter-spacing:2px}
#startScreen p{color:#8aa;font-size:13px;margin-bottom:20px}
.nationGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:400px}
.nationCard{padding:14px;border-radius:8px;background:#16283a;border:2px solid transparent;text-align:center;font-size:15px;cursor:pointer}
.nationCard:active{transform:scale(.96)}
.nationCard small{color:#9ab}
</style>
</head>
<body>
<div id="startScreen">
  <h1>⚙️ 钢铁雄心4</h1>
  <p>1936年 · 欧洲 · 选择你的国家</p>
  <div class="nationGrid" id="nationGrid"></div>
</div>

<div id="app" style="display:none">
  <div id="hud">
    <span class="stat">📅 <span id="dateEl"></span></span>
    <span class="stat">⭐ <span id="ppEl"></span></span>
    <span class="stat">🪖 <span id="unitEl"></span></span>
    <span class="stat">🏭 <span id="facEl"></span></span>
    <button id="speedBtn" onclick="cycleSpeed()">▶️</button>
  </div>
  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="tileInfo">点击地图选择部队</div>
  </div>
  <div id="logPanel"><div id="logEl"></div></div>
  <div id="tabs">
    <button class="tabBtn" id="tab-prod" onclick="switchTab('prod')">🏭 生产</button>
    <button class="tabBtn" id="tab-research" onclick="switchTab('research')">🔬 科研</button>
    <button class="tabBtn" id="tab-diplo" onclick="switchTab('diplo')">🤝 外交</button>
    <button class="tabBtn" id="tab-close" onclick="closePanels()">✕ 收起</button>
  </div>
  <div class="panel" id="panel-prod"><div id="prodList"></div></div>
  <div class="panel" id="panel-research"><div id="researchList"></div></div>
  <div class="panel" id="panel-diplo"><div id="diploList"></div></div>
</div>

<script src="data_map.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script>
// 选国界面
const grid=document.getElementById('nationGrid');
['GER','SOV','ENG','FRA','ITA','POL'].forEach(t=>{
  const n=NATIONS[t];
  const c=document.createElement('div');
  c.className='nationCard';
  c.style.borderLeftColor=n.color;
  c.style.borderLeftWidth='5px';
  c.innerHTML=`<b>${n.name}</b><small>${n.fac} · 工业${n.ind}</small>`;
  c.onclick=()=>startGame(t);
  grid.appendChild(c);
});
function startGame(tag){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  initGame(tag);
  setupCanvas();
  updateHUD();
  draw();
}
let curSpeed=0;
function cycleSpeed(){
  curSpeed=curSpeed>=4?0:curSpeed+1;
  setSpeed(curSpeed);
}
function closePanels(){
  document.querySelectorAll('.panel').forEach(p=>{p.style.display='none';p.classList.remove('active');});
  document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
}
// 初始隐藏面板
document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
</script>
</body>
</html>
