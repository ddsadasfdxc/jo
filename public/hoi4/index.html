<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>钢铁雄心 · 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070d16;color:#dfe6ee;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
#gl{position:fixed;inset:0}
#gl canvas{display:block}
/* 顶部HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:10;
  background:linear-gradient(180deg,rgba(5,10,18,.85),rgba(5,10,18,0));pointer-events:none}
#hud .stat{background:rgba(20,35,55,.75);backdrop-filter:blur(6px);padding:4px 10px;border-radius:6px;font-size:13px;border:1px solid #2a3a50}
#speedBtn{pointer-events:auto;background:rgba(40,70,110,.8);border:1px solid #3a5a80;color:#fff;padding:6px 14px;border-radius:6px;font-size:15px;margin-left:auto}
/* 地块信息 */
#tileInfo{position:fixed;left:10px;bottom:120px;background:rgba(10,22,38,.85);backdrop-filter:blur(8px);
  padding:8px 12px;border-radius:8px;font-size:12px;max-width:64%;z-index:10;pointer-events:none;border:1px solid #2a4a6a;line-height:1.5}
/* 日志 */
#logPanel{position:fixed;left:10px;bottom:64px;right:10px;height:48px;overflow:hidden;z-index:9;
  font-size:10.5px;color:#8fb0d0;mask-image:linear-gradient(180deg,transparent,#000 30%);pointer-events:none}
/* 底部标签 */
#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;z-index:11;background:rgba(10,20,34,.9);backdrop-filter:blur(8px);border-top:1px solid #223}
.tabBtn{flex:1;padding:11px 0;text-align:center;background:none;border:none;color:#7a94b0;font-size:13.5px}
.tabBtn.active{color:#ffd700;border-top:2px solid #ffd700}
.panel{position:fixed;bottom:52px;left:0;right:0;height:36vh;overflow-y:auto;padding:12px;z-index:11;
  background:rgba(10,20,34,.95);backdrop-filter:blur(10px);transform:translateY(110%);transition:transform .25s}
.panel.show{transform:translateY(0)}
.item{padding:10px 12px;margin-bottom:7px;background:rgba(30,50,75,.5);border-radius:8px;font-size:13.5px}
.item.cur{border-left:3px solid #ffd700}
.item.done{opacity:.5}.item.locked{opacity:.35}
.item.diplo{display:flex;justify-content:space-between;align-items:center}
.item small{color:#6a86a8;display:block;font-size:11px}
.warBtn{background:#8a2a2a;border:none;color:#fff;padding:6px 16px;border-radius:6px;font-size:12.5px}
.warTag{color:#ff6b6b;font-size:12.5px}
/* 选国/加载/结束 全屏覆盖 */
.overlay{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,#16283f 0%,#070d16 75%);padding:24px}
.overlay h1{font-size:30px;color:#ffd700;letter-spacing:3px;margin-bottom:4px;text-shadow:0 0 24px rgba(255,215,0,.4)}
.overlay .sub{color:#7a94b0;font-size:13px;margin-bottom:26px}
.nationGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:420px}
.ncard{padding:16px;border-radius:10px;background:rgba(30,50,78,.6);border:1px solid #2a4a6a;border-left-width:5px;
  font-size:15px;cursor:pointer;transition:transform .1s}
.ncard:active{transform:scale(.95)}
.ncard small{color:#8fb0d0}
#loadBar{width:200px;height:4px;background:#1a2a40;border-radius:2px;margin-top:18px;overflow:hidden}
#loadFill{height:100%;width:0;background:#ffd700;transition:width .2s}
#gameOver{display:none}
#gameOver h2{color:#ffd700;font-size:24px;margin-bottom:20px}
#restartBtn{background:#2a4a6a;border:1px solid #3a5a80;color:#fff;padding:12px 40px;border-radius:8px;font-size:16px}
</style>
</head>
<body>
<div id="gl"></div>

<div id="hud" style="display:none">
  <span class="stat">📅 <span id="dateEl"></span></span>
  <span class="stat">⭐ <span id="ppEl"></span></span>
  <span class="stat">🪖 <span id="unitEl"></span></span>
  <span class="stat">🏭 <span id="facEl"></span></span>
  <button id="speedBtn">▶️</button>
</div>
<div id="tileInfo" style="display:none">点击选择部队</div>
<div id="logPanel" style="display:none"><div id="logEl"></div></div>

<div id="tabs" style="display:none">
  <button class="tabBtn" data-tab="prod" id="tab-prod">🏭 生产</button>
  <button class="tabBtn" data-tab="research" id="tab-research">🔬 科研</button>
  <button class="tabBtn" data-tab="diplo" id="tab-diplo">🤝 外交</button>
</div>
<div class="panel" id="panel-prod"><div id="prodList"></div></div>
<div class="panel" id="panel-research"><div id="researchList"></div></div>
<div class="panel" id="panel-diplo"><div id="diploList"></div></div>

<div class="overlay" id="startScreen">
  <h1>⚙️ 钢铁雄心</h1>
  <div class="sub">1936 · 欧洲 · 全面战争 · 3D</div>
  <div class="nationGrid" id="nationGrid"></div>
  <div id="loadBar" style="display:none"><div id="loadFill"></div></div>
  <div class="sub" id="loadText" style="margin-top:8px"></div>
</div>

<div class="overlay" id="gameOver">
  <h2></h2>
  <button id="restartBtn">再来一局</button>
</div>

<script src="data.js?v=20260802a"></script>
<script src="game.js?v=20260802a"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import { boot } from './main.js?v=20260802a';
const grid=document.getElementById('nationGrid');
['GER','SOV','ENG','FRA','ITA','POL'].forEach(t=>{
  const n=NATIONS[t];
  const c=document.createElement('div');
  c.className='ncard';
  c.style.borderLeftColor=n.css;
  c.innerHTML=`<b>${n.name}</b><small>${n.fac} · 工业${n.ind}</small>`;
  c.onclick=()=>startGame(t);
  grid.appendChild(c);
});
async function startGame(tag){
  const ss=document.getElementById('startScreen');
  document.getElementById('nationGrid').style.display='none';
  document.getElementById('loadBar').style.display='block';
  document.getElementById('loadText').textContent='正在部署战场…';
  document.getElementById('loadFill').style.width='60%';
  try{
    await boot(tag);
    document.getElementById('loadFill').style.width='100%';
    setTimeout(()=>{
      ss.style.display='none';
      ['hud','tabs','tileInfo','logPanel'].forEach(id=>document.getElementById(id).style.display='');
      document.getElementById('tileInfo').style.display='block';
    },300);
  }catch(err){
    document.getElementById('loadText').textContent='加载失败：'+err.message;
    console.error(err);
  }
}
</script>
</body>
</html>
